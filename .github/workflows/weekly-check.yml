name: Weekly Customer Health Check

on:
  schedule:
    # Every Monday at 8:00 AM UTC. Adjust the cron expression for a
    # different day/time — cron fields are: minute hour day month weekday
    - cron: "0 8 * * 1"
  workflow_dispatch: {}
    # ^ this line adds a manual "Run workflow" button in the GitHub UI,
    # so you can test it immediately instead of waiting for Monday.

jobs:
  check-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run health check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python check_health.py

      - name: Regenerate dashboard
        run: python regenerate_dashboard.py

      - name: Commit updated status history and dashboard
        run: |
          git config user.name "health-check-bot"
          git config user.email "actions@github.com"
          git add status_history.json index.html
          git diff --staged --quiet || git commit -m "Refresh status history and dashboard [automated]"
          git push
